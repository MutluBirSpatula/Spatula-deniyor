<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Açık Artırma & Draft Oyunu</title>
<style>
:root {
--p1-color: #ff4757;
--p2-color: #1e90ff;
--bg: #0f172a;
--card-bg: #1e293b;
--accent: #f59e0b;
}

* {
box-sizing: border-box;
user-select: none;
-webkit-user-select: none;
-webkit-tap-highlight-color: transparent;
}

body {
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
background: #0b0f19;
color: #ffffff;
margin: 0;
padding: 0;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
}

.game-container {
width: 100%;
max-width: 450px;
height: 100vh;
max-height: 850px;
background: #131c2e;
position: relative;
display: flex;
flex-direction: column;
justify-content: space-between;
align-items: center;
padding: 12px;
overflow: hidden;
box-shadow: 0 0 50px rgba(0,0,0,0.8);
}

/* EKRANLAR VE OVERLAY */
.start-screen, .end-screen, .library-screen {
position: absolute;
inset: 0;
background: rgba(15, 23, 42, 0.98);
z-index: 9999;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 20px;
}

.start-title {
font-size: 34px;
font-weight: 800;
color: #f59e0b;
text-shadow: 0 4px 0 #b45309, 0 0 20px rgba(245, 158, 11, 0.4);
margin-bottom: 10px;
animation: bounce 1.2s infinite alternate;
}

.start-subtitle {
font-size: 14px;
color: #94a3b8;
margin-bottom: 25px;
line-height: 1.4;
}

.btn-main {
background: linear-gradient(135deg, #22c55e, #16a34a);
color: white;
font-size: 20px;
font-weight: 800;
padding: 14px 40px;
border-radius: 50px;
border: 3px solid #bbf7d0;
box-shadow: 0 6px 0 #15803d, 0 10px 20px rgba(0,0,0,0.4);
cursor: pointer;
touch-action: manipulation;
margin-bottom: 10px;
width: 85%;
}

.btn-main:active {
transform: translateY(4px);
box-shadow: 0 2px 0 #15803d;
}

.btn-sec {
background: #334155;
color: #f8fafc;
border: 2px solid #475569;
padding: 10px 20px;
border-radius: 30px;
font-size: 14px;
font-weight: 700;
cursor: pointer;
width: 85%;
}

/* OYUNCU SKOR PANOLARI */
.header-players {
width: 100%;
display: flex;
justify-content: space-between;
align-items: flex-start;
z-index: 10;
}

.player-box {
width: 125px;
padding: 8px 10px;
border-radius: 16px;
text-align: center;
box-shadow: 0 6px 12px rgba(0,0,0,0.3);
position: relative;
}

.player-box.p1 { background: #ff4757; border: 3px solid #ff6b81; color: white; }
.player-box.p2 { background: #1e90ff; border: 3px solid #70a1ff; color: white; }

.player-name { font-size: 13px; font-weight: 800; margin-bottom: 2px; }

.slot-container {
display: flex;
flex-direction: column;
gap: 4px;
margin-top: 6px;
min-height: 160px;
}

.slot-item {
background: rgba(0,0,0,0.35);
border-radius: 8px;
padding: 4px 6px;
font-size: 10px;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
animation: popIn 0.25s ease-out;
display: flex;
align-items: center;
gap: 6px;
border: 1px solid rgba(255,255,255,0.15);
}

.topic-title-box {
position: absolute;
top: 12px;
left: 50%;
transform: translateX(-50%);
display: flex;
flex-direction: column;
align-items: center;
z-index: 5;
}

.topic-title {
background: #f59e0b;
color: #000;
padding: 6px 14px;
border-radius: 20px;
font-size: 12px;
font-weight: 800;
box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
text-align: center;
white-space: nowrap;
}

/* KART SAHNESİ VE SÜRÜKLEME */
.card-stage {
width: 100%;
flex: 1;
display: flex;
justify-content: center;
align-items: center;
position: relative;
margin: 10px 0;
touch-action: none;
}

.item-card {
width: 250px;
height: 330px;
background: linear-gradient(145deg, #1e293b, #0f172a);
border: 4px solid #334155;
border-radius: 24px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
padding: 16px;
box-shadow: 0 20px 40px rgba(0,0,0,0.5);
position: absolute;
cursor: grab;
will-change: transform;
}

.item-card.dragging { cursor: grabbing; }

.item-card.fly-left {
transition: transform 0.35s ease-in, opacity 0.25s;
transform: translate3d(-350px, -80px, 0) rotate(-25deg) scale(0.3) !important;
opacity: 0;
}

.item-card.fly-right {
transition: transform 0.35s ease-in, opacity 0.25s;
transform: translate3d(350px, -80px, 0) rotate(25deg) scale(0.3) !important;
opacity: 0;
}

.item-card.shake {
animation: shake 0.4s ease-in-out;
border-color: #ef4444 !important;
}

.item-image-box {
width: 100%;
height: 150px;
background: rgba(255,255,255,0.05);
border-radius: 16px;
display: flex;
justify-content: center;
align-items: center;
border: 1px solid rgba(255,255,255,0.1);
box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
}

.item-image-box svg {
width: 75px;
height: 75px;
fill: #f59e0b;
}

.item-card-title {
font-size: 16px;
font-weight: 700;
color: #ffffff;
text-align: center;
margin: 6px 0 2px 0;
}

.item-card-type {
font-size: 10px;
padding: 3px 10px;
border-radius: 12px;
font-weight: 800;
text-transform: uppercase;
}

.type-legendary { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
.type-bad { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
.type-normal { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #60a5fa; }

/* BUTONLAR */
.controls-row {
width: 100%;
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
margin-bottom: 8px;
}

.btn-swipe {
width: 56px;
height: 56px;
border-radius: 50%;
border: none;
font-size: 22px;
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
box-shadow: 0 6px 12px rgba(0,0,0,0.3);
touch-action: manipulation;
}

.btn-swipe-p1 { background: #ff4757; color: white; }
.btn-swipe-p2 { background: #1e90ff; color: white; }

.btn-bottom-group {
display: flex;
gap: 8px;
width: 100%;
}

.btn-restart {
flex: 1;
background: #334155;
color: #f8fafc;
border: 2px solid #475569;
padding: 10px;
border-radius: 14px;
font-size: 13px;
font-weight: 700;
cursor: pointer;
}

.toast-msg {
position: absolute;
bottom: 80px;
left: 50%;
transform: translateX(-50%);
background: #ef4444;
color: white;
padding: 8px 16px;
border-radius: 20px;
font-size: 12px;
font-weight: 700;
opacity: 0;
transition: opacity 0.3s;
pointer-events: none;
z-index: 3000;
}

.library-list {
width: 100%;
max-height: 380px;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
margin-bottom: 15px;
padding-right: 5px;
}

.library-item {
background: #1e293b;
padding: 12px;
border-radius: 12px;
border: 1px solid #334155;
text-align: left;
font-weight: 700;
font-size: 14px;
cursor: pointer;
color: #f8fafc;
display: flex;
justify-content: space-between;
align-items: center;
}

.library-item:hover { border-color: #f59e0b; }

@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-12px) rotate(-4deg); } 40%, 80% { transform: translateX(12px) rotate(4deg); } }
</style>
</head>

<div class="game-container">

<!-- BAŞLANGIÇ EKRANI -->
<div class="start-screen" id="startScreen">

<div class="start-subtitle">20+ Farklı Konu Başlığı, Vektörel Kartlar, Efsane ve Kötü Seçimler!</div>

</div>

</div>

<!-- OYUN SONU EKRANI -->
<div class="end-screen" id="endScreen" style="display:none;">

<p style="font-size:13px; color:#94a3b8;">Kadro seçimleri tamamlandı. Yeni bir konuyla devam et!</p>
<button class="btn-main" onclick="nextRandomTopic()">🎲 YENİ KONU İLE OYNA</button>
<button class="btn-sec" onclick="openLibraryFromEnd()">📚 Konu Seç</button>
</div>

<div class="toast-msg" id="toastMsg">Slot Dolu! (6/6)</div>

<!-- OYUNCU PANOLARI -->
<div class="header-players">

<div class="player-box p2">

</div>
</div>

<!-- KART SAHNESİ -->
<div class="card-stage">

<div style="font-size: 11px; color: #94a3b8; text-align: center;" id="cardDesc">Açıklama</div>
</div>
</div>

<!-- KONTROLLER -->
<div style="width: 100%;">
<div class="controls-row">
<button class="btn-swipe btn-swipe-p1" onclick="choosePlayer(1)">👈</button>
<span style="font-size: 11px; color: #64748b; font-weight: 700;">SOLA / SAĞA KAYDIR</span>
<button class="btn-swipe btn-swipe-p2" onclick="choosePlayer(2)">👉</button>
</div>
<div class="btn-bottom-group">
<button class="btn-restart" onclick="restartGame()">🔄 Konuyu Sıfırla</button>
<button class="btn-restart" onclick="nextRandomTopic()" style="background:#f59e0b; color:#000; border-color:#d97706;">🎲 Yeni Konu Getir</button>
</div>
</div>

</div>

let currentTopicIndex = 0;
let currentItemIndex = 0;
let p1Items = [];
let p2Items = [];
let isAnimating = false;

// Kütüphane Sayısını Güncelle
document.getElementById('topicCountText').innerText = topicsDatabase.length;

function startGame() {
document.getElementById('startScreen').style.display = 'none';
restartGame();
}

function nextRandomTopic() {
document.getElementById('endScreen').style.display = 'none';
let nextIdx = Math.floor(Math.random() * topicsDatabase.length);
if (nextIdx === currentTopicIndex && topicsDatabase.length > 1) {
nextIdx = (nextIdx + 1) % topicsDatabase.length;
}
currentTopicIndex = nextIdx;
restartGame();
}

function restartGame() {
p1Items = [];
p2Items = [];
currentItemIndex = 0;
updateUI();
}

function openLibrary() {
const list = document.getElementById('libraryList');
list.innerHTML = '';
topicsDatabase.forEach((t, idx) => {
list.innerHTML += <div class="library-item" onclick="selectTopicFromLibrary(${idx})"><span>${t.title}&lt;/span&gt;&lt;span style="color:#f59e0b; font-size:12px;"&gt;12 Öğe&lt;/span&gt;&lt;/div>;
});
document.getElementById('libraryScreen').style.display = 'flex';
}

function closeLibrary() {
document.getElementById('libraryScreen').style.display = 'none';
}

function openLibraryFromEnd() {
document.getElementById('endScreen').style.display = 'none';
openLibrary();
}

function selectTopicFromLibrary(idx) {
currentTopicIndex = idx;
closeLibrary();
document.getElementById('startScreen').style.display = 'none';
restartGame();
}

function updateUI() {
var topic = topicsDatabase[currentTopicIndex];
document.getElementById('topicTitle').innerText = topic.title;

document.getElementById('slotCountP1').innerText = p1Items.length + " / 6";
document.getElementById('slotCountP2').innerText = p2Items.length + " / 6";

renderSlots('slotsP1', p1Items);
renderSlots('slotsP2', p2Items);

var activeCard = document.getElementById('activeCard');
activeCard.className = 'item-card';
activeCard.style.transform = 'none';

if (currentItemIndex < topic.items.length) {
var item = topic.items[currentItemIndex];
document.getElementById('cardName').innerText = item.name;
document.getElementById('cardSvgContainer').innerHTML = item.svg;
document.getElementById('cardDesc').innerText = item.badge;

var cardType = document.getElementById('cardType');
cardType.innerText = item.type === 'legendary' ? 'EFSANE' : (item.type === 'bad' ? 'KÖTÜ' : 'NORMAL');
cardType.className = 'item-card-type type-' + item.type;

activeCard.style.display = 'flex';
} else {
activeCard.style.display = 'none';
document.getElementById('endScreen').style.display = 'flex';
}
}

function renderSlots(elementId, items) {
var container = document.getElementById(elementId);
container.innerHTML = '';
for (var i = 0; i < items.length; i++) {
container.innerHTML += '<div class="slot-item"><span>' + items[i].name + '</span></div>';
}
}

function showToast(msg) {
var toast = document.getElementById('toastMsg');
toast.innerText = msg;
toast.style.opacity = '1';
setTimeout(function() { toast.style.opacity = '0'; }, 1200);
}

function choosePlayer(playerNum) {
if (isAnimating) return;
var topic = topicsDatabase[currentTopicIndex];
if (currentItemIndex >= topic.items.length) return;

var item = topic.items[currentItemIndex];
var targetArray = playerNum === 1 ? p1Items : p2Items;

if (targetArray.length >= 6) {
var card = document.getElementById('activeCard');
card.classList.add('shake');
showToast('Oyuncu ' + playerNum + ' Slotu Dolu! (6/6)');
setTimeout(function() { card.classList.remove('shake'); }, 400);
return;
}

isAnimating = true;
var card = document.getElementById('activeCard');
card.classList.add(playerNum === 1 ? 'fly-left' : 'fly-right');

setTimeout(function() {
targetArray.push(item);
currentItemIndex++;
isAnimating = false;
updateUI();
}, 300);
}

/* TOUCH + MOUSE SÜRÜKLEME */
var activeCard = document.getElementById('activeCard');
var startX = 0, currentX = 0, isDragging = false;

function onStart(x) {
if (isAnimating) return;
isDragging = true;
startX = x;
activeCard.classList.add('dragging');
}

function onMove(x) {
if (!isDragging) return;
currentX = x;
var deltaX = currentX - startX;
var rotate = deltaX * 0.08;
activeCard.style.transform = 'translate3d(' + deltaX + 'px, 0, 0) rotate(' + rotate + 'deg)';
}

function onEnd() {
if (!isDragging) return;
isDragging = false;
activeCard.classList.remove('dragging');

var deltaX = currentX - startX;
if (deltaX < -70) {
choosePlayer(1);
} else if (deltaX > 70) {
choosePlayer(2);
} else {
activeCard.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
}
}

activeCard.addEventListener('touchstart', function(e) { onStart(e.touches[0].clientX); });
window.addEventListener('touchmove', function(e) { if (isDragging) onMove(e.touches[0].clientX); });
window.addEventListener('touchend', onEnd);

activeCard.addEventListener('mousedown', function(e) { onStart(e.clientX); });
window.addEventListener('mousemove', function(e) { if (isDragging) onMove(e.clientX); });
window.addEventListener('mouseup', onEnd);
</script>
